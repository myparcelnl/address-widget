allowBuilds:
  esbuild: false
  msw: false
  vue-demi: false

autoDedupe: true

lockfile:
  includeResolutionSettings: true

# Same patterns as the cooldown exclude in .github/dependabot.yml, so a new release of our own packages installs at once.
minimumReleaseAgeExclude:
  - '@myparcel/*'
  - '@myparcel-dev/*'
  - '@myparcel-eslint/*'
  - '@myparcel-pdk/*'

overrides:
  conventional-changelog-conventionalcommits: "^8.0.0"

packages:
  - .
