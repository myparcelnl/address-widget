name: Run pull request checks

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm run lint

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    secrets: inherit

  test:
    needs:
      - lint
      - build
    # test.yml posts the coverage report as a comment on the pull request.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test.yml
    secrets: inherit

  notify-on-failure:
    needs:
      - lint
      - build
      - test
    if: always() && contains(needs.*.result, 'failure')
    uses: myparcelnl/actions/.github/workflows/notify-on-failure.yml@v6
    secrets: inherit
